[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "fb-crawl"
version = "0.1.0"
description = "Public and authenticated Facebook data collection CLI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["curl-cffi", "httpx>=0.28,<1", "selectolax"]

[project.optional-dependencies]
browser = ["selenium>=4.16,<5", "beautifulsoup4>=4.12,<5"]
xlsx = ["openpyxl>=3.1,<4"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[project.scripts]
fb-crawl = "fb_crawl.cli.app:main"
