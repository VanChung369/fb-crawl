[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "fb-crawl"
version = "0.1.0"
description = "Public and authenticated Facebook data collection CLI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "curl-cffi",
    "httpx>=0.28,<1",
    "psycopg[binary]>=3.2,<4",
    "selectolax",
]

[project.optional-dependencies]
browser = ["selenium>=4.16,<5", "beautifulsoup4>=4.12,<5"]
api = ["fastapi>=0.115,<1", "pydantic>=2,<3", "uvicorn>=0.34,<1"]
xlsx = ["openpyxl>=3.1,<4"]
dev = [
    "pytest",
    "build>=1,<2",
    "fastapi>=0.115,<1",
    "pydantic>=2,<3",
    "uvicorn>=0.34,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fb_data_pipeline = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"

[project.scripts]
fb-crawl = "fb_crawl.cli.app:main"
